<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot Plot Example: What a latte costs in each city | 100 Free Data Charts</title>
<meta name="description" content="A working dot plot made with HTML, CSS and vanilla JavaScript. Compare several values per row, hide sizes from the key, sort, and download the file.">
<link rel="canonical" href="https://mmrahmanbappi.github.io/100-free-data-charts/01-comparison/007-dot-plot/demo.html">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Change these colors to match your brand */
:root {
  --bg: #f2eef5;
  --card: #ffffff;
  --ink: #231a33;
  --muted: #675d78;
  --line: #e8e2ee;
  --accent: #8a5cc7;
  --soft: #efe7f9;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; min-height: 100vh; }
.page { max-width: 1160px; margin: 0 auto; padding: 28px 24px 40px; }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; font-size: .95rem; }
.logo { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 10px; }
.logo b { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: inline-block; }
.brand span:last-child { color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 30px 22px; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
h1 { font-size: clamp(1.35rem, 2.6vw, 1.8rem); line-height: 1.2; }
.sub { color: var(--muted); margin-top: 6px; max-width: 60ch; }
.take { margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--soft); font-weight: 500; display: inline-block; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { font: inherit; font-size: .9rem; border: 0; background: none; color: var(--muted); padding: 7px 12px; border-radius: 7px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
#legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 4px; min-height: 8px; }
.key { font: inherit; font-size: .9rem; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: none; color: var(--ink); padding: 5px 11px; border-radius: 99px; cursor: pointer; }
.key:disabled { cursor: default; opacity: 1; }
.key i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.key[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
#chart { height: 420px; margin-top: 6px; position: relative; }
#chart svg { display: block; overflow: visible; }
.grid { stroke: var(--line); }
.axis { stroke: var(--muted); stroke-width: 1.2; }
.tick { fill: var(--muted); font-size: 12px; }
.label { fill: var(--ink); font-size: 13px; }
.value { fill: var(--ink); font-size: 12px; font-weight: 700; }
.hit { cursor: pointer; outline: none; transition: opacity .15s; }
.hit:hover, .hit:focus-visible { opacity: .8; }
.hit:focus-visible { stroke: var(--ink); stroke-width: 2; }
.note { color: var(--muted); font-size: .85rem; margin-top: 10px; }
details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 500; }
table { border-collapse: collapse; margin-top: 12px; font-size: .9rem; width: 100%; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
td { font-variant-numeric: tabular-nums; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--card); padding: 8px 11px; border-radius: 8px; font-size: .85rem; line-height: 1.4; max-width: 240px; }
#tip[hidden] { display: none; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

@media (max-width: 640px) {
  .page { padding: 16px 12px 30px; }
  .card { padding: 20px 16px 16px; }
  #chart { height: 380px; }
}
</style>
</head>
<body>
<main class="page">
  <header class="brand"><span class="logo"><b aria-hidden="true"></b>Brew Lane Coffee</span><span>Menu prices, September 2026</span></header>
  <section class="card" aria-labelledby="title">
    <div class="head">
      <div>
        <h1 id="title">What a latte costs in each city</h1>
        <p class="sub">Small, medium and large prices on one line for every city we serve.</p>
        <p class="take">Boston is the most expensive city. A large latte there costs $5.60.</p>
      </div>
      <div class="seg" role="group" aria-label="Sort cities"><button type="button" data-v="price" aria-pressed="true">By medium price</button><button type="button" data-v="name" aria-pressed="false">By city name</button></div>
    </div>
    <div id="legend"></div>
    <figure id="chart" aria-label="What a latte costs in each city. Boston is the most expensive city. A large latte there costs $5.60. Use Tab to step through each value."></figure>
    <p class="note">Source: Brew Lane menu boards. Sample data for this demo.</p>
    <details><summary>Show the data as a table</summary><table id="table"></table></details>
  </section>
</main>
<div id="tip" hidden></div>
<script>
// Small helpers: SVG elements, scales, tooltip, legend and table.
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]static/.test(location.search);
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs || {}) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function text(parent, x, y, str, attrs) {
  const t = el('text', Object.assign({ x, y }, attrs || {}), parent);
  t.textContent = str;
  return t;
}
function linear(d0, d1, r0, r1) {
  const f = v => r0 + (v - d0) / (d1 - d0) * (r1 - r0);
  f.domain = [d0, d1];
  return f;
}
function band(keys, r0, r1, pad) {
  const step = (r1 - r0) / keys.length;
  const bw = step * (1 - pad);
  const f = k => r0 + keys.indexOf(k) * step + (step - bw) / 2;
  f.bw = bw; f.step = step;
  return f;
}
function niceTicks(min, max, count) {
  const span = max - min;
  const raw = span / count;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  const out = [];
  for (let v = Math.ceil(min / step) * step; v <= max + step / 1e6; v += step) out.push(+v.toFixed(10));
  return out;
}
function niceMax(v, count) {
  const t = niceTicks(0, v, count || 5);
  const last = t[t.length - 1];
  return last >= v ? last : last + (t[1] - t[0]);
}
function fmt(n, d) { return n.toLocaleString('en-US', { maximumFractionDigits: d == null ? 0 : d }); }
function tween(dur, delay, fn) {
  if (reduce) { fn(1); return; }
  const start = performance.now() + (delay || 0);
  fn(0);
  function step(now) {
    const t = Math.min(1, Math.max(0, (now - start) / dur));
    fn(1 - Math.pow(1 - t, 3));
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
const tip = document.getElementById('tip');
function showTip(html, x, y) {
  tip.innerHTML = html;
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = x + 14, top = y - h - 12;
  if (left + w > innerWidth - 8) left = x - w - 14;
  if (top < 8) top = y + 16;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTip() { tip.hidden = true; }
function bindTip(node, label, html) {
  node.setAttribute('tabindex', '0');
  node.setAttribute('role', 'img');
  node.setAttribute('aria-label', label);
  node.classList.add('hit');
  node.addEventListener('mousemove', e => showTip(html, e.clientX, e.clientY));
  node.addEventListener('mouseleave', hideTip);
  node.addEventListener('focus', () => { const r = node.getBoundingClientRect(); showTip(html, r.left + r.width / 2, r.top); });
  node.addEventListener('blur', hideTip);
}
function yGrid(g, scale, ticks, x0, x1, format) {
  ticks.forEach(v => {
    const y = scale(v);
    el('line', { x1: x0, x2: x1, y1: y, y2: y, class: v === 0 ? 'axis' : 'grid' }, g);
    text(g, x0 - 10, y + 4, format(v), { class: 'tick', 'text-anchor': 'end' });
  });
}
function xGrid(g, scale, ticks, y0, y1, format) {
  ticks.forEach(v => {
    const x = scale(v);
    el('line', { x1: x, x2: x, y1: y0, y2: y1, class: v === 0 ? 'axis' : 'grid' }, g);
    text(g, x, y1 + 20, format(v), { class: 'tick', 'text-anchor': 'middle' });
  });
}
function legend(items, onToggle) {
  const box = document.getElementById('legend');
  box.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'key';
    b.setAttribute('aria-pressed', 'true');
    b.innerHTML = '<i style="background:' + it.color + '"></i>' + it.name;
    if (onToggle) b.onclick = () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', on);
      onToggle(it.name, on);
    };
    else b.disabled = true;
    box.appendChild(b);
  });
}
function table(head, rows) {
  const t = document.getElementById('table');
  t.innerHTML = '<thead><tr>' + head.map(h => '<th scope="col">' + h + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map((c, i) => i ? '<td>' + c + '</td>' : '<th scope="row">' + c + '</th>').join('') + '</tr>').join('') + '</tbody>';
}
function mount(draw) {
  const box = document.getElementById('chart');
  let last = 0;
  function render(animate) {
    const w = box.clientWidth, h = box.clientHeight;
    box.innerHTML = '';
    const svg = el('svg', { viewBox: '0 0 ' + w + ' ' + h, width: w, height: h }, box);
    draw(svg, w, h, animate);
  }
  new ResizeObserver(() => {
    if (Math.abs(box.clientWidth - last) < 2) return;
    const first = last === 0;
    last = box.clientWidth;
    render(first);
  }).observe(box);
  return render;
}
function buttons(onPick) {
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    onPick(b.dataset.v);
  });
}

// The chart
const SIZES = [{ name: 'Small', color: '#c7a8e8' }, { name: 'Medium', color: '#8a5cc7' }, { name: 'Large', color: '#4b2a86' }];
const DATA = [['Seattle', [3.9, 4.6, 5.3]], ['Austin', [3.4, 4.1, 4.7]], ['Denver', [3.6, 4.3, 5.0]], ['Boston', [4.1, 4.9, 5.6]],
  ['Chicago', [3.8, 4.5, 5.2]], ['Portland', [3.7, 4.4, 5.1]], ['Miami', [3.5, 4.2, 4.9]], ['Phoenix', [3.2, 3.8, 4.4]]];
let order = 'price';
const hidden = new Set();
const money = v => '$' + v.toFixed(2);
table(['City'].concat(SIZES.map(s => s.name)), DATA.map(d => [d[0]].concat(d[1].map(money))));
const render = mount((svg, w, h, animate) => {
  const small = w < 560;
  const rows = order === 'price' ? [...DATA].sort((a, b) => b[1][1] - a[1][1]) : [...DATA].sort((a, b) => a[0].localeCompare(b[0]));
  const m = { t: 8, r: 20, b: 34, l: small ? 76 : 100 };
  const x = linear(3, 6, m.l, w - m.r);
  const y = band(rows.map(d => d[0]), m.t, h - m.b, 0);
  const g = el('g', {}, svg);
  xGrid(g, x, small ? [3, 4, 5, 6] : [3, 3.5, 4, 4.5, 5, 5.5, 6], m.t, h - m.b, v => '$' + v.toFixed(2));
  rows.forEach((d, ri) => {
    const cy = y(d[0]) + y.bw / 2;
    text(g, m.l - 14, cy + 5, d[0], { class: 'label', 'text-anchor': 'end' });
    const vis = d[1].filter((v, i) => !hidden.has(SIZES[i].name));
    if (vis.length > 1) {
      const ln = el('line', { y1: cy, y2: cy, stroke: 'var(--line)', 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
      const lo = Math.min(...vis), hi = Math.max(...vis);
      const draw = t => { ln.setAttribute('x1', x(lo)); ln.setAttribute('x2', x(lo) + (x(hi) - x(lo)) * t); };
      animate ? tween(600, ri * 50, draw) : draw(1);
    }
    d[1].forEach((v, si) => {
      if (hidden.has(SIZES[si].name)) return;
      const dot = el('circle', { cy, r: small ? 7 : 9, fill: SIZES[si].color, stroke: 'var(--card)', 'stroke-width': 2 }, g);
      const draw = t => { dot.setAttribute('cx', x(3) + (x(v) - x(3)) * t); dot.style.opacity = t; };
      animate ? tween(700, ri * 50 + si * 60, draw) : draw(1);
      bindTip(dot, d[0] + ', ' + SIZES[si].name + ' latte: ' + money(v), '<b>' + d[0] + '</b><br>' + SIZES[si].name + ' latte: ' + money(v));
    });
  });
});
legend(SIZES, (name, on) => { on ? hidden.delete(name) : hidden.add(name); render(true); });
buttons(v => { order = v; render(true); });
</script>
</body>
</html>
